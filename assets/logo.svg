<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Coffees &amp; Barbers Co.">
  <defs>
    <path id="ringTop" d="M 11,120 A 109,109 0 0 1 229,120" fill="none"/>
  </defs>

  <circle cx="120" cy="120" r="119" fill="#fff"/>
  <circle cx="120" cy="120" r="98" fill="none" stroke="#141414" stroke-width="10"/>

  <text fill="#141414" font-family="'Oswald','Arial Narrow',sans-serif" font-size="16" font-weight="700" letter-spacing="1">
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">COFFEES &amp; BARBERS</textPath>
  </text>
  <text x="120" y="212" fill="#141414" font-family="'Oswald','Arial Narrow',sans-serif" font-size="19" font-weight="700" letter-spacing="4" text-anchor="middle">CO</text>

  <!-- bowler hat -->
  <g transform="translate(120,90)">
    <ellipse cx="0" cy="12" rx="26" ry="5.5" fill="#141414"/>
    <path d="M -18,12 C -18,-10 18,-10 18,12 C 13,3.5 -13,3.5 -18,12 Z" fill="#141414"/>
  </g>

  <!-- monocle -->
  <g transform="translate(131,116)" stroke="#141414" stroke-width="2.4" fill="none">
    <circle cx="0" cy="0" r="7.5"/>
    <line x1="0" y1="7.5" x2="0" y2="20"/>
  </g>

  <!-- mustache -->
  <path d="M 120,138
           C 113,131 103,133 100,140
           C 97,144 101,148 106,146
           C 109,145 110,141 113,140
           C 110,146 113,151 120,148
           C 127,151 130,146 127,140
           C 130,141 131,145 134,146
           C 139,148 143,144 140,140
           C 137,133 127,131 120,138 Z"
        fill="#141414"/>

  <!-- coffee cup + steam -->
  <g transform="translate(120,178)">
    <path d="M -10,-12 C -10,-17 -5,-17 -5,-12" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M -2,-14 C -2,-19 3,-19 3,-14" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 5,-12 C 5,-17 10,-17 10,-12" fill="none" stroke="#141414" stroke-width="2.2" stroke-linecap="round"/>

    <path d="M -22,-7 L 22,-7 L 18,17 C 18,23 -18,23 -18,17 Z" fill="none" stroke="#141414" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M 19,-3 C 31,-3 31,12 19,10" fill="none" stroke="#141414" stroke-width="2.6"/>
    <line x1="-27" y1="26" x2="27" y2="26" stroke="#141414" stroke-width="2.6" stroke-linecap="round"/>
  </g>
</svg>
