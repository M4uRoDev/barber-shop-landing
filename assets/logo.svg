<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Coffees &amp; Barbers Co.">
  <defs>
    <path id="ringTop" d="M 20,100 A 80,80 0 0 1 180,100" fill="none"/>
    <path id="ringBottom" d="M 34,138 A 80,80 0 0 0 166,138" fill="none"/>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#141414"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#f2ede1" stroke-width="2"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#f2ede1" stroke-width="1.5"/>

  <text fill="#f2ede1" font-family="'Oswald','Arial Narrow',sans-serif" font-size="15" font-weight="600" letter-spacing="3.5">
    <textPath href="#ringTop" startOffset="50%" text-anchor="middle">COFFEES &amp; BARBERS</textPath>
  </text>
  <text fill="#f2ede1" font-family="'Oswald','Arial Narrow',sans-serif" font-size="15" font-weight="600" letter-spacing="6">
    <textPath href="#ringBottom" startOffset="50%" text-anchor="middle">CO.</textPath>
  </text>

  <circle cx="35" cy="100" r="2.4" fill="#f2ede1"/>
  <circle cx="165" cy="100" r="2.4" fill="#f2ede1"/>

  <!-- bowler hat -->
  <g transform="translate(100,78)">
    <ellipse cx="0" cy="10" rx="24" ry="5.5" fill="#f2ede1"/>
    <path d="M -16,10 C -16,-10 16,-10 16,10 C 16,-2 -16,-2 -16,10 Z" fill="#f2ede1"/>
    <path d="M -16,-1 C -16,-15 16,-15 16,-1 C 12,-6 -12,-6 -16,-1 Z" fill="#f2ede1"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(100,122)">
    <path d="M -18,-6 L 16,-6 L 13,14 C 13,19 -10,19 -10,14 Z" fill="none" stroke="#f2ede1" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 15,-2 C 26,-2 26,12 15,10" fill="none" stroke="#f2ede1" stroke-width="3"/>
    <line x1="-18" y1="-6" x2="16" y2="-6" stroke="#f2ede1" stroke-width="3"/>
    <path d="M -10,-11 C -10,-16 -4,-16 -4,-11" fill="none" stroke="#f2ede1" stroke-width="2" stroke-linecap="round"/>
    <path d="M 2,-11 C 2,-16 8,-16 8,-11" fill="none" stroke="#f2ede1" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
